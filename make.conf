COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native"
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"
VIDEO_CARDS="intel"
MAKEOPTS="-j8"
USE="-gtk -gnome -kde -telemetry -systemd -wayland -cups -emacs \
     -cdinstall -aqua -cdr -coreaudio -dvd -ios -ipod -css -a52 -cjk \
     -clamav -ieee1394 -ibm -xemacs -emboss -cdda -dvdr -smartcard \
     savedconfig xinerama X"
ACCEPT_LICENSE="*"
QEMU_USER_TARGETS="x86_64 i386"
QEMU_SOFTMMU_TARGETS="i386 x86_64"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8

GENTOO_MIRRORS="https://mirror.aarnet.edu.au/pub/gentoo/ \
http://mirror.aarnet.edu.au/pub/gentoo/ \
rsync://mirror.aarnet.edu.au/pub/gentoo/ \
ftp://ftp.swin.edu.au/gentoo \
http://ftp.swin.edu.au/gentoo"
GRUB_PLATFORMS="efi-64"
